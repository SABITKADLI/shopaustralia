name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # match your local pnpm major version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Start API
        run: |
          cd apps/api
          pnpm dev &> /tmp/api.log &
          API_PID=$!
          echo $API_PID > /tmp/api.pid
          echo "API PID: $API_PID"

      - name: Wait for API
        run: |
          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -sSf http://localhost:3001/health > /dev/null 2>&1; then
              echo " API ready"
              exit 0
            fi
            echo "Attempt $i/30 - Waiting..."
            sleep 2
          done
          echo " API did not start within 60 seconds"
          echo ""
          echo "==== Last 50 lines of api.log ===="
          tail -n 50 /tmp/api.log 2>/dev/null || echo "Could not read api.log"
          echo ""
          echo "==== Process status ===="
          ps aux | grep -i "ts-node\|node" | grep -v grep || echo "No API process found"
          exit 1

      - name: Type check
        run: pnpm -w -r run type-check || true

      - name: Lint
        run: pnpm -w -r run lint || true
