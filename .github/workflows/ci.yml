name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # match your local pnpm major version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Start API
        run: |
          cd apps/api
          pnpm dev &> /tmp/api.log &
          echo $! > /tmp/api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:3001/health > /dev/null; then
              echo "API ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not start"
          echo "==== api.log ===="
          cat /tmp/api.log || echo "no api.log"
          exit 1

      - name: Type check
        run: pnpm -w -r run type-check || true

      - name: Lint
        run: pnpm -w -r run lint || true
